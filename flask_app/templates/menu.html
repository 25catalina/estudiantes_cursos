<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cursos</title>
</head>
<body>
    <h1>crear curso</h1>
    <form action="/crear_curso" method="POST">
        <label for="nombre">Nombre del curso:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br>
        <br>
        <input type="submit" value="Crear Curso" />
    </form>

    <h1>todos los cursos</h1>
   <ul>
        {% for curso in cursos %}
            <li><a href="/cursos/{{ curso.id }}">{{ curso.nombre }}</a></li>
        {% endfor %}
    </ul>

    <a href="/estudiante">crear estudiante</a>
</body>
</html>
